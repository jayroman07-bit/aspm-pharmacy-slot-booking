<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASPM College - Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fa;
  color:#222;
}

.header{
  background:#1557a6;
  color:white;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

input{
  padding:11px;
  width:100%;
  box-sizing:border-box;
  margin:7px 0 14px;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  padding:11px 18px;
  border:0;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.login-btn{
  background:#168c50;
  color:white;
  width:100%;
}

.logout-btn{
  background:#d9534f;
  color:white;
  float:right;
}

.download-btn{
  background:#1557a6;
  color:white;
  margin-bottom:15px;
}

.message{
  margin-top:12px;
  font-weight:bold;
}

.error{
  color:#c62828;
}

.success{
  color:#168c50;
}

.hidden{
  display:none;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:left;
  white-space:nowrap;
}

th{
  background:#1557a6;
  color:white;
}

.filters{
  display:flex;
  gap:15px;
  align-items:end;
  margin-bottom:15px;
}

.filters div{
  flex:1;
}

.count{
  font-size:18px;
  font-weight:bold;
  margin:15px 0;
}

@media(max-width:700px){
  .filters{
    display:block;
  }
}
</style>
</head>

<body>

<div class="header">
ASPM COLLEGE OF PHARMACY<br>
Admin Booking Dashboard
</div>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h2>Admin Login</h2>

  <label>Email</label>
  <input type="email" id="email" placeholder="Admin Email">

  <label>Password</label>
  <input type="password" id="password" placeholder="Password">

  <button class="login-btn" onclick="login()">Login</button>

  <div id="loginMessage" class="message"></div>
</div>


<!-- DASHBOARD -->
<div id="dashboard" class="card hidden">

  <button class="logout-btn" onclick="logout()">Logout</button>

  <h2>Booking Dashboard</h2>

  <div class="filters">

    <div>
      <label>Select Date</label>
      <input type="date" id="filterDate"
             min="2026-09-07"
             max="2026-09-11">
    </div>

    <div>
      <button class="download-btn" onclick="loadBookings()">
        View Bookings
      </button>
    </div>

    <div>
      <button class="download-btn" onclick="downloadCSV()">
        Download CSV
      </button>
    </div>

  </div>

  <div class="count" id="bookingCount">
    Total Bookings: 0
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Booking ID</th>
          <th>Student Name</th>
          <th>Mobile</th>
          <th>PRN / Seat No.</th>
          <th>Passing Year</th>
          <th>Booking Date</th>
          <th>Slot Time</th>
          <th>Created At</th>
        </tr>
      </thead>

      <tbody id="bookingTable">
      </tbody>
    </table>
  </div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://zhrtsnnxbwrdplehvobi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_IKTxetJxdv-4qHEVID3FxQ_hMTJ7dP4";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let bookingsData = [];


/* LOGIN */
async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("loginMessage");

  msg.className="message";
  msg.textContent="Logging in...";

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){

    msg.className="message error";
    msg.textContent=error.message;
    return;
  }

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .classList.remove("hidden");

  document.getElementById("filterDate").value =
    "2026-09-07";

  loadBookings();
}


/* LOAD BOOKINGS */
async function loadBookings(){

  const date =
    document.getElementById("filterDate").value;

  const table =
    document.getElementById("bookingTable");

  table.innerHTML =
    "<tr><td colspan='8'>Loading...</td></tr>";

  let query =
    supabaseClient
      .from("bookings")
      .select("*")
      .order("booking_date",{ascending:true})
      .order("slot_time",{ascending:true});

  if(date){
    query = query.eq("booking_date",date);
  }

  const {data,error} = await query;

  if(error){

    table.innerHTML =
      "<tr><td colspan='8'>Error: "+
      error.message+
      "</td></tr>";

    return;
  }

  bookingsData = data || [];

  document.getElementById("bookingCount")
    .textContent =
    "Total Bookings: " + bookingsData.length;

  if(bookingsData.length === 0){

    table.innerHTML =
      "<tr><td colspan='8'>No bookings found.</td></tr>";

    return;
  }

  table.innerHTML = "";

  bookingsData.forEach(row => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${escapeHTML(row.booking_id || "")}</td>
      <td>${escapeHTML(row.student_name || "")}</td>
      <td>${escapeHTML(row.mobile || "")}</td>
      <td>${escapeHTML(row.prn || "")}</td>
      <td>${escapeHTML(row.passing_year || "")}</td>
      <td>${escapeHTML(row.booking_date || "")}</td>
      <td>${escapeHTML(formatTime(row.slot_time || ""))}</td>
      <td>${escapeHTML(row.created_at || "")}</td>
    `;

    table.appendChild(tr);
  });
}


/* CSV DOWNLOAD */
function downloadCSV(){

  if(bookingsData.length === 0){
    alert("No bookings available to download.");
    return;
  }

  const headers = [
    "Booking ID",
    "Student Name",
    "Mobile",
    "PRN / Seat Number",
    "Passing Year",
    "Booking Date",
    "Slot Time",
    "Created At"
  ];

  const rows = bookingsData.map(row => [

    row.booking_id || "",
    row.student_name || "",
    row.mobile || "",
    row.prn || "",
    row.passing_year || "",
    row.booking_date || "",
    formatTime(row.slot_time || ""),
    row.created_at || ""

  ]);

  const csv = [
    headers,
    ...rows
  ]
  .map(row =>
    row.map(value =>
      '"' + String(value).replace(/"/g,'""') + '"'
    ).join(",")
  )
  .join("\n");

  const blob =
    new Blob([csv],{
      type:"text/csv;charset=utf-8;"
    });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;

  const date =
    document.getElementById("filterDate").value ||
    "all";

  a.download =
    "ASPM_Bookings_" + date + ".csv";

  a.click();

  URL.revokeObjectURL(url);
}


/* LOGOUT */
async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("dashboard")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("password").value="";
}


/* HELPERS */
function formatTime(time){

  if(!time) return "";

  return time.substring(0,5);
}

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
